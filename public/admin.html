<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Love Constructor</title>
  <link rel="stylesheet" href="/fonts/inter.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
    }

    .topbar {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; background: #1e293b; border-bottom: 1px solid #334155;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-left span { font-size: 20px; }
    .topbar-left h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-right a { color: #94a3b8; text-decoration: none; font-size: 13px; }
    .topbar-right a:hover { color: #e2e8f0; }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: #1e293b; border-radius: 12px; padding: 20px;
      border: 1px solid #334155;
    }
    .stat-card .num { font-size: 32px; font-weight: 700; color: #e91e63; }
    .stat-card .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 18px; font-weight: 600; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid #334155;
    }

    table {
      width: 100%; border-collapse: collapse; background: #1e293b;
      border-radius: 12px; overflow: hidden; border: 1px solid #334155;
    }
    th {
      text-align: left; padding: 12px 16px; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px; color: #64748b;
      background: #0f172a; border-bottom: 1px solid #334155;
    }
    td {
      padding: 10px 16px; font-size: 13px; border-bottom: 1px solid #1e293b;
    }
    tr:hover td { background: rgba(233, 30, 99, 0.05); }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600;
    }
    .badge-admin { background: rgba(233, 30, 99, 0.15); color: #e91e63; }
    .badge-user { background: rgba(100, 116, 139, 0.15); color: #94a3b8; }

    .system-info {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }
    .sys-item {
      background: #1e293b; border-radius: 8px; padding: 12px 16px;
      border: 1px solid #334155; display: flex; justify-content: space-between;
    }
    .sys-item .key { color: #64748b; font-size: 12px; }
    .sys-item .val { color: #e2e8f0; font-size: 13px; font-weight: 500; }

    .loader { text-align: center; padding: 60px; color: #64748b; }
    .access-denied { text-align: center; padding: 80px 20px; }
    .access-denied h2 { color: #e91e63; margin-bottom: 8px; }
    .access-denied p { color: #64748b; }

    @media (max-width: 600px) {
      .container { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      table { font-size: 12px; }
      th, td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <span>🛠</span>
      <h1>Админ-панель</h1>
    </div>
    <div class="topbar-right">
      <a href="/dashboard">Дашборд</a>
      <a href="/">Конструктор</a>
    </div>
  </div>

  <div class="container">
    <div id="content">
      <div class="loader">Загрузка...</div>
    </div>
  </div>

  <script>
    let statsData = null;

    async function checkAdmin() {
      try {
        const resp = await fetch('/api/auth/me', { credentials: 'include' });
        if (!resp.ok) { window.location.href = '/login'; return false; }
        const user = await resp.json();
        if (!user.isAdmin) {
          document.getElementById('content').innerHTML = `
            <div class="access-denied">
              <h2>Доступ запрещён</h2>
              <p>Эта страница доступна только администраторам.</p>
              <a href="/dashboard" style="color:#e91e63;margin-top:16px;display:inline-block;">Вернуться в дашборд</a>
            </div>`;
          return false;
        }
        return true;
      } catch (e) {
        window.location.href = '/login';
        return false;
      }
    }

    async function loadStats() {
      try {
        const resp = await fetch('/api/admin/stats', { credentials: 'include' });
        if (!resp.ok) throw new Error('Ошибка');
        statsData = await resp.json();
        renderStats();
      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="loader">Ошибка загрузки: ${e.message}</div>`;
      }
    }

    async function loadSystem() {
      try {
        const resp = await fetch('/api/admin/system', { credentials: 'include' });
        if (!resp.ok) throw new Error('Ошибка');
        return await resp.json();
      } catch (e) {
        return null;
      }
    }

    function renderStats() {
      const s = statsData;
      const content = document.getElementById('content');

      const dateStr = (d) => {
        if (!d) return '';
        const dt = new Date(d);
        return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
      };

      content.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div class="num">${s.totals.users}</div><div class="label">Пользователей</div></div>
          <div class="stat-card"><div class="num">${s.totals.invitations}</div><div class="label">Приглашений</div></div>
          <div class="stat-card"><div class="num">${s.responses.total}</div><div class="label">Ответов</div></div>
          <div class="stat-card"><div class="num">${s.responses.yesCount}</div><div class="label">Сказали «Да»</div></div>
          <div class="stat-card"><div class="num">${s.totals.activeUsers}</div><div class="label">Активных (7 дн)</div></div>
        </div>

        <div class="section">
          <h2 class="section-title">Последние пользователи</h2>
          <table>
            <thead><tr><th>Email</th><th>Имя</th><th>Роль</th><th>Дата</th></tr></thead>
            <tbody>
              ${s.recentUsers.map(u => `
                <tr>
                  <td>${esc(u.email || '—')}</td>
                  <td>${esc(u.display_name)}</td>
                  <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
                  <td>${dateStr(u.created_at)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="section">
          <h2 class="section-title">Последние приглашения</h2>
          <table>
            <thead><tr><th>Название</th><th>Для кого</th><th>Владелец</th><th>Дата</th></tr></thead>
            <tbody>
              ${s.recentInvitations.map(i => `
                <tr>
                  <td>${esc(i.title || 'Без названия')}</td>
                  <td>${i.girl_name ? esc(i.girl_name) : '—'}</td>
                  <td>${esc(i.owner_email)}</td>
                  <td>${dateStr(i.created_at)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="section">
          <h2 class="section-title">Система</h2>
          <div class="system-info" id="systemInfo">Загрузка...</div>
        </div>
      `;

      loadSystem().then(sys => {
        if (!sys) return;
        document.getElementById('systemInfo').innerHTML = `
          <div class="sys-item"><span class="key">Node.js</span><span class="val">${sys.nodeVersion}</span></div>
          <div class="sys-item"><span class="key">Uptime</span><span class="val">${Math.floor(sys.uptime / 60)} мин</span></div>
          <div class="sys-item"><span class="key">RAM</span><span class="val">${Math.round(sys.memoryUsage.rss / 1024 / 1024)} MB</span></div>
          <div class="sys-item"><span class="key">БД</span><span class="val">${sys.dbSize}</span></div>
        `;
      });
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

    (async function() {
      const ok = await checkAdmin();
      if (ok) loadStats();
    })();
  </script>
</body>
</html>
