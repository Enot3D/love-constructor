<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Приглашение</title>
  <link rel="stylesheet" href="/css/ads.css">
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
      background: #fce4ec;
    }
    .loader {
      text-align: center;
      color: #e91e63;
      font-size: 18px;
      animation: pulse 1.5s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .error {
      text-align: center;
      color: #c62828;
      font-size: 16px;
      padding: 40px;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 50px);
      height: calc(100dvh - 50px);
      border: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: 50px;
    }
    .ad-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 50px;
      background: rgba(255,255,255,0.95);
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #bbb;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">Загрузка приглашения...</div>
  <div class="error" id="error" style="display:none;"></div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const loader = document.getElementById('loader');
      const errorEl = document.getElementById('error');

      if (!id) {
        loader.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = 'Приглашение не найдено. Неверная ссылка.';
        return;
      }

      try {
        const response = await fetch('/api/invitations/' + id + '/public');
        if (!response.ok) throw new Error('Ошибка сети');
        const data = await response.json();

        if (!data || !data.html) {
          loader.style.display = 'none';
          errorEl.style.display = 'block';
          errorEl.textContent = 'Приглашение не найдено или было удалено.';
          return;
        }

        let html = data.html;
        html = html.replace('__INVITE_ID__', id);

        loader.style.display = 'none';
        const iframe = document.createElement('iframe');
        const blob = new Blob([html], { type: 'text/html' });
        iframe.src = URL.createObjectURL(blob);
        document.body.appendChild(iframe);

        if (data.title) document.title = data.title + ' — Приглашение';

      } catch (e) {
        loader.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = 'Не удалось загрузить приглашение. Попробуйте позже.';
        console.error(e);
      }
    })();
  </script>
  <div class="ad-footer" id="ad-slot-view">
    <div class="ad-banner" style="margin:0;border:none;background:transparent;min-height:auto;"></div>
  </div>
  <script src="/js/ad.js"></script>
</body>
</html>
